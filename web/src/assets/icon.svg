<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source of the committed PWA icons (public/icons/icon-{192,512}.png).
       Regenerate with `npm run gen-icons` after editing.
       Two coins: the game is one bid meeting another. -->
  <rect width="512" height="512" rx="96" fill="#ca8a04" />
  <g fill="none" stroke="#fffbeb" stroke-width="18">
    <circle cx="196" cy="200" r="86" fill="#fde68a" />
    <circle cx="316" cy="312" r="86" fill="#fef3c7" />
  </g>
  <g fill="#8a5a00" font-family="Outfit, system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="196" y="200" font-size="96" dominant-baseline="central">1</text>
    <text x="316" y="312" font-size="96" dominant-baseline="central">2</text>
  </g>
</svg>
